<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <defs>
    <linearGradient id="apGrad" x1="6" y1="6" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="apAccent" x1="16" y1="14" x2="36" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="textGrad" x1="130" y1="16" x2="210" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="apGlow" x="0" y="0" width="56" height="56" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon Mark Container -->
  <g filter="url(#apGlow)">
    <rect x="6" y="6" width="44" height="44" rx="12" fill="url(#apGrad)" />
    <!-- Stylized 'A' chevron / gateway -->
    <path d="M28 14L16 38H22.5L28 26L33.5 38H40L28 14Z" fill="url(#apAccent)" />
    <!-- Dynamic crossbar -->
    <path d="M22 32.5H34L35.5 36H20.5L22 32.5Z" fill="#FFFFFF" />
    <!-- Focal Nexus Node (Point) -->
    <circle cx="28" cy="27" r="3.2" fill="#06B6D4" stroke="#FFFFFF" stroke-width="1.5" />
  </g>

  <!-- Wordmark -->
  <g>
    <!-- "Access" in deep navy, "Point" in gradient -->
    <text x="60" y="32" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="21" fill="#0F172A" letter-spacing="-0.4">Access<tspan fill="url(#textGrad)" font-weight="800">Point</tspan></text>
    <!-- Tagline -->
    <text x="61" y="45" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="7.5" fill="#64748B" letter-spacing="1.6">TASK ALIGNMENT PORTAL</text>
  </g>
</svg>
