<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <defs>
    <!-- Deep Blue Gradient matching the portal navy -->
    <linearGradient id="shBlue" x1="6" y1="6" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020659" />
      <stop offset="50%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Vibrant Orange Gradient matching portal primary orange -->
    <linearGradient id="shOrange" x1="16" y1="12" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="60%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Wordmark Hub Orange Gradient -->
    <linearGradient id="textHub" x1="115" y1="16" x2="180" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <filter id="shGlow" x="0" y="0" width="56" height="56" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#020659" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Icon Mark: Modern SmartHub Nexus -->
  <g filter="url(#shGlow)">
    <!-- Base rounded tile in deep royal blue -->
    <rect x="6" y="6" width="44" height="44" rx="12" fill="url(#shBlue)" />

    <!-- Connected Hub Network lines & nodes forming 'S' and 'Hub' -->
    <path d="M35 18C33 16 30 15 27 15C21.5 15 18 18.5 18 23C18 30 38 26 38 33C38 37.5 34.5 41 29 41C25 41 21 39 19 37" 
          stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Orange Hub Nodes -->
    <circle cx="28" cy="28" r="4.2" fill="url(#shOrange)" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="35" cy="18" r="2.8" fill="url(#shOrange)" />
    <circle cx="19" cy="37" r="2.8" fill="url(#shOrange)" />
  </g>

  <!-- Wordmark -->
  <g>
    <!-- "Smart" in deep navy, "Hub" in vibrant orange -->
    <text x="60" y="32" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#020659" letter-spacing="-0.4">Smart<tspan fill="url(#textHub)" font-weight="800">Hub</tspan></text>
    <!-- Tagline -->
    <text x="61" y="45" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="7.5" fill="#64748B" letter-spacing="1.6">TASK ALIGNMENT PORTAL</text>
    <!-- Orange accent dot -->
    <circle cx="185" cy="22" r="2.5" fill="#F97316" />
  </g>
</svg>
