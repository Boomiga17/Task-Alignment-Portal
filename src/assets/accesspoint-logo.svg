<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <defs>
    <!-- Deep Blue Gradient matching the portal navy -->
    <linearGradient id="apBlueGrad" x1="6" y1="6" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020659" />
      <stop offset="50%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Vibrant Orange Gradient matching the portal primary orange -->
    <linearGradient id="apOrangeGrad" x1="18" y1="14" x2="46" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="60%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Point Text Orange Gradient -->
    <linearGradient id="textOrange" x1="124" y1="16" x2="200" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <filter id="apShadow" x="0" y="0" width="56" height="56" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#020659" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Icon Mark -->
  <g filter="url(#apShadow)">
    <!-- Base rounded tile in deep royal blue -->
    <rect x="6" y="6" width="44" height="44" rx="12" fill="url(#apBlueGrad)" />

    <!-- Stylized Chevron / Arch 'A' in crisp white -->
    <path d="M28 14L16 38H22.5L28 26L33.5 38H40L28 14Z" fill="#FFFFFF" />

    <!-- Dynamic Orange Accent Bridge -->
    <path d="M22 32.5H34L35.5 36.5H20.5L22 32.5Z" fill="url(#apOrangeGrad)" />

    <!-- Radiant Orange Nexus Point -->
    <circle cx="28" cy="27" r="3.6" fill="url(#apOrangeGrad)" stroke="#FFFFFF" stroke-width="1.8" />
  </g>

  <!-- Wordmark -->
  <g>
    <!-- "Access" in deep navy blue (#020659) -->
    <text x="60" y="32" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="21" fill="#020659" letter-spacing="-0.4">Access<tspan fill="url(#textOrange)" font-weight="800">Point</tspan></text>
    <!-- Tagline with orange accent dot -->
    <text x="61" y="45" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="7.5" fill="#64748B" letter-spacing="1.6">TASK ALIGNMENT PORTAL</text>
    <circle cx="206" cy="22" r="2.5" fill="#F97316" />
  </g>
</svg>
